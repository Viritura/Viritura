name: Bug report
description: Report a reproducible problem in Viritura
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Search existing issues first.
        **Do not report security vulnerabilities here.** Use the private security-reporting link in the issue chooser.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest score, file, or steps that reproduce the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Viritura app
      description: Where did the problem occur?
      options:
        - Web app
        - Desktop app
        - VS Code extension
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and browser as relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add logs, screenshots, recordings, or a minimal non-sensitive MNX file.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: This report contains no credentials, private user data, or suspected vulnerability details.
          required: true
