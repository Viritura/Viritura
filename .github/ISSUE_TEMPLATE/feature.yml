name: Feature request
description: Propose a new capability or a substantial behavior change
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Large changes require maintainer agreement before implementation.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what can they not accomplish today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include scope, compatibility considerations, and relevant standards or engraving practice.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing request and reviewed the public documentation.
          required: true
        - label: I will wait for maintainer agreement before starting a large implementation.
          required: true
