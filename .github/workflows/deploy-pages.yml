name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Pages project to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - website
          - editor

permissions:
  contents: read

concurrency:
  group: deploy-pages-production
  cancel-in-progress: false

jobs:
  changes:
    name: Select Pages targets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - id: select
        name: Select requested targets
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          case "$TARGET" in
            all) echo 'targets=["website","editor"]' >> "$GITHUB_OUTPUT" ;;
            website) echo 'targets=["website"]' >> "$GITHUB_OUTPUT" ;;
            editor) echo 'targets=["editor"]' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown target: $TARGET" >&2; exit 2 ;;
          esac

  deploy:
    name: Preview, smoke, and deploy ${{ matrix.target }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    environment:
      name: cloudflare-pages-production
      url: ${{ matrix.target == 'website' && 'https://viritura.com' || 'https://app.viritura.com' }}
    env:
      VITE_VIRITURA_API_BASE_URL: https://api.viritura.com
      VITE_VIRITURA_ASSET_BASE_URL: https://assets.viritura.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.93.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - id: target
        name: Configure target
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          preview_branch="preprod-${GITHUB_SHA::12}"
          if [[ "$TARGET" == "website" ]]; then
            project="viritura-website"
            directory="dist"
            preview_url="https://${preview_branch}.viritura-website.pages.dev"
            production_url="https://viritura.com"
          else
            project="viritura-app"
            directory="apps/editor/dist"
            preview_url="https://${preview_branch}.viritura-app.pages.dev"
            production_url="https://app.viritura.com"
          fi
          {
            echo "branch=$preview_branch"
            echo "project=$project"
            echo "directory=$directory"
            echo "preview_url=$preview_url"
            echo "production_url=$production_url"
          } >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.target }} Pages artifact
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT_DIRECTORY: ${{ steps.target.outputs.directory }}
        shell: bash
        run: |
          bash scripts/build-cloudflare-pages.sh "$TARGET"
          printf '%s\n' "$GITHUB_SHA" > "$OUTPUT_DIRECTORY/viritura-build-${GITHUB_SHA}.txt"
      - name: Deploy ${{ matrix.target }} preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler pages deploy "${{ steps.target.outputs.directory }}"
          --project-name "${{ steps.target.outputs.project }}"
          --branch "${{ steps.target.outputs.branch }}"
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=false
      - name: Wait for ${{ matrix.target }} preview
        env:
          PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            content="$(curl --fail --silent --show-error \
              "$PREVIEW_URL/viritura-build-${GITHUB_SHA}.txt" || true)"
            if [[ "$content" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            echo "Preview has not published build $GITHUB_SHA yet (attempt $attempt/12)."
            sleep 5
          done
          echo "Preview did not publish build $GITHUB_SHA within 60 seconds." >&2
          exit 1
      - name: Smoke-test ${{ matrix.target }} preview
        env:
          PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$TARGET" == "website" ]]; then
            VIRITURA_WEBSITE_URL="$PREVIEW_URL" pnpm e2e:deployed
          else
            PLAYWRIGHT_BASE_URL="$PREVIEW_URL" pnpm e2e:smoke
          fi
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-${{ matrix.target }}-preview-smoke-failures
          path: test-results
          if-no-files-found: warn
          retention-days: 7
      - name: Deploy ${{ matrix.target }} production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler pages deploy "${{ steps.target.outputs.directory }}"
          --project-name "${{ steps.target.outputs.project }}"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=false
      - name: Wait for ${{ matrix.target }} production
        env:
          PRODUCTION_URL: ${{ steps.target.outputs.production_url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            content="$(curl --fail --silent --show-error \
              "$PRODUCTION_URL/viritura-build-${GITHUB_SHA}.txt" || true)"
            if [[ "$content" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            echo "Production has not published build $GITHUB_SHA yet (attempt $attempt/12)."
            sleep 5
          done
          echo "Production did not publish build $GITHUB_SHA within 60 seconds." >&2
          exit 1
      - name: Verify ${{ matrix.target }} production
        env:
          PRODUCTION_URL: ${{ steps.target.outputs.production_url }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$TARGET" == "website" ]]; then
            VIRITURA_WEBSITE_URL="$PRODUCTION_URL" pnpm e2e:deployed
          else
            PLAYWRIGHT_BASE_URL="$PRODUCTION_URL" pnpm e2e:smoke
          fi
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-${{ matrix.target }}-production-smoke-failures
          path: test-results
          if-no-files-found: warn
          retention-days: 7
