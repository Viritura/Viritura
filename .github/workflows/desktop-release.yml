name: Desktop Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize reruns for the same release without interrupting an active upload.
concurrency:
  group: desktop-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 installers
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.installers.outputs.artifact-id }}
    env:
      RUSTUP_TOOLCHAIN: 1.93.1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For release events this is the tagged commit, including on reruns.
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            engine
            apps\desktop\src-tauri
          key: desktop-release-wasm-pack-0.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Test desktop
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: pnpm test:desktop

      - name: Build desktop
        run: |
          # A restored Cargo target cache may contain installers from an older version.
          $bundle = 'apps\desktop\src-tauri\target\release\bundle'
          if (Test-Path $bundle) {
            Remove-Item $bundle -Recurse -Force
          }
          pnpm build:desktop

      - name: Collect installers
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'apps\desktop\src-tauri\target\release\bundle'
          $msi = @(Get-ChildItem "$bundle\msi\*_x64_*.msi" -File)
          $nsis = @(Get-ChildItem "$bundle\nsis\*_x64-setup.exe" -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw 'Expected exactly one Windows x64 MSI and one NSIS installer.'
          }
          New-Item -ItemType Directory -Path desktop-installers | Out-Null
          Copy-Item $msi[0].FullName desktop-installers\Viritura-windows-x64.msi
          Copy-Item $nsis[0].FullName desktop-installers\Viritura-windows-x64.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: installers
        with:
          name: desktop-windows-x64-${{ github.sha }}
          path: desktop-installers
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attach installers to published release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Only download this run's installers; never execute the build in a write job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: desktop-installers
          merge-multiple: true

      - name: Upload release installers
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          # Retry uploads explicitly below so every attempt reconciles server-side state.
          retries: 0
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const repo = context.repo;
            const eventRelease = context.payload.release;
            if (context.eventName !== 'release' || context.payload.action !== 'published' ||
                !Number.isSafeInteger(eventRelease?.id) || eventRelease.id <= 0 ||
                typeof eventRelease.tag_name !== 'string' || !eventRelease.tag_name) {
              throw new Error('Expected a published release event with an explicit release ID and tag.');
            }
            const release_id = eventRelease.id;

            const directory = path.join(process.env.GITHUB_WORKSPACE, 'desktop-installers');
            const names = ['Viritura-windows-x64.exe', 'Viritura-windows-x64.msi'];
            const files = await fs.readdir(directory);
            if (files.length !== names.length || names.some(name => !files.includes(name))) {
              throw new Error('Expected only the two Windows x64 installers from this build.');
            }
            const installers = new Map();
            for (const name of names) {
              const stat = await fs.lstat(path.join(directory, name));
              if (!stat.isFile() || stat.size === 0 || stat.size >= 2 ** 31) {
                throw new Error(`Invalid release asset: ${name}`);
              }
              const data = await fs.readFile(path.join(directory, name));
              if (data.length !== stat.size) {
                throw new Error(`Release asset size changed during validation: ${name}`);
              }
              const peOffset = data.length >= 64 ? data.readUInt32LE(60) : 0;
              const validHeader = name.endsWith('.msi')
                ? data.length >= 512 && data.subarray(0, 8).equals(Buffer.from('d0cf11e0a1b11ae1', 'hex'))
                : data.length >= 64 && data[0] === 0x4d && data[1] === 0x5a &&
                  peOffset >= 64 && peOffset <= data.length - 4 &&
                  data.readUInt32LE(peOffset) === 0x00004550;
              if (!validHeader) {
                throw new Error(`Invalid installer header: ${name}`);
              }
              installers.set(name, {
                data,
                size: stat.size,
                digest: `sha256:${createHash('sha256').update(data).digest('hex')}`,
              });
            }

            async function validateRelease() {
              // Read the original release by ID; never create or edit release metadata.
              const { data: release } = await github.rest.repos.getRelease({ ...repo, release_id });
              if (release.id !== release_id || release.tag_name !== eventRelease.tag_name || release.draft) {
                throw new Error('The published release was changed; refusing to upload installers.');
              }
              if (release.immutable) {
                throw new Error('Cannot attach installers after publication to an immutable release. No further release assets will be changed.');
              }
              // target_commitish can be a branch. Resolve the actual tag to a commit instead.
              const { data: commit } = await github.rest.repos.getCommit({
                ...repo, ref: `refs/tags/${eventRelease.tag_name}`,
              });
              if (commit.sha !== context.sha) {
                throw new Error('The release tag no longer points to the built commit; refusing to upload installers.');
              }
              return release;
            }

            const listAssets = () => github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id, per_page: 100,
            });
            const matches = (asset, name) => asset.name === name && asset.state === 'uploaded' &&
              asset.size === installers.get(name).size && asset.digest === installers.get(name).digest;
            const emptyStarter = asset => asset.state === 'starter' && asset.size === 0 &&
              asset.digest == null;
            function selectAsset(list, name) {
              const assets = list.filter(asset => asset.name === name);
              if (assets.length > 1) {
                throw new Error(`Multiple release assets named ${name}; refusing to change them.`);
              }
              const asset = assets[0];
              if (asset && (!Number.isSafeInteger(asset.id) || asset.id <= 0)) {
                throw new Error(`Invalid release asset ID: ${name}`);
              }
              return asset;
            }
            const namedAsset = async name => selectAsset(await listAssets(), name);
            function checkReplaceable(asset, name, retry) {
              if (!asset || matches(asset, name) || emptyStarter(asset)) return;
              // A rerun can replace a known completed older build, but a retry must
              // never destroy unexpected data that appeared after an ambiguous failure.
              if (!retry && asset.state === 'uploaded' &&
                  Number.isSafeInteger(asset.size) && asset.size > 0 && asset.size < 2 ** 31 &&
                  typeof asset.digest === 'string' && /^sha256:[0-9a-f]{64}$/.test(asset.digest)) return;
              throw new Error(`Unexpected release asset state or data: ${name}; refusing to replace it.`);
            }

            await validateRelease();
            const initialAssets = await listAssets();
            for (const name of names) {
              checkReplaceable(selectAsset(initialAssets, name), name, false);
            }
            for (const name of names) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                await validateRelease();
                const asset = await namedAsset(name);
                if (asset && matches(asset, name)) {
                  core.info(`Keeping verified release asset: ${name}`);
                  break;
                }
                checkReplaceable(asset, name, attempt > 1);
                if (asset) {
                  const initial = selectAsset(initialAssets, name);
                  if (!emptyStarter(asset) && (!initial || asset.id !== initial.id ||
                      asset.state !== initial.state || asset.size !== initial.size || asset.digest !== initial.digest)) {
                    throw new Error(`Release asset changed since initial validation: ${name}; refusing to replace it.`);
                  }
                  await validateRelease();
                  await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
                }
                await validateRelease();
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    ...repo, release_id, name,
                    data: installers.get(name).data,
                    // GitHub requires Content-Length (normally supplied by the client).
                    // Explicit framing is defensive, not a diagnosis of storage HTTP 5xx.
                    headers: {
                      'content-type': 'application/octet-stream',
                      'content-length': installers.get(name).size,
                    },
                  });
                  break;
                } catch (error) {
                  if (!Number.isInteger(error.status) || error.status < 500 || error.status > 599) throw error;
                  // A 5xx can hide a completed upload. Reconcile even on the last attempt.
                  await validateRelease();
                  const pending = await namedAsset(name);
                  if (pending && matches(pending, name)) {
                    core.info(`Verified completed upload after HTTP ${error.status}: ${name}`);
                    break;
                  }
                  checkReplaceable(pending, name, true);
                  if (attempt === 3) {
                    throw new Error(`Release asset upload failed after ${attempt} attempts: ${name}`, { cause: error });
                  }
                  core.warning(`HTTP ${error.status} uploading ${name}; retrying attempt ${attempt + 1}/3.`);
                  await new Promise(resolve => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
            }
            const uploaded = await listAssets();
            const release = await validateRelease();
            if (names.some(name =>
              uploaded.filter(asset => asset.name === name).length !== 1 ||
              !uploaded.some(asset => matches(asset, name))
            )) {
              throw new Error('Release asset verification failed. Rerun the failed publishing job to reconcile installers; matching uploads will be preserved.');
            }

            core.notice(`Attached Windows x64 installers built from ${context.sha} to release ${release_id}: ${release.html_url}`);
