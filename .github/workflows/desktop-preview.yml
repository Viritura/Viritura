name: Desktop Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publisher while it is replacing the rolling release.
concurrency:
  group: desktop-preview
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 installers
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.93.1
      VITE_VIRITURA_API_BASE_URL: https://api.viritura.com
      VITE_VIRITURA_ASSET_BASE_URL: https://assets.viritura.com
      # Native playback uses the separately bundled SF2 resource.
      VIRITURA_EXTERNAL_SOUNDFONT: "true"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            engine
            apps\desktop\src-tauri
          key: desktop-preview-wasm-pack-0.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Test desktop
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: pnpm test:desktop

      - name: Build desktop
        run: |
          # A restored Cargo target cache may contain installers from an older version.
          $bundle = 'apps\desktop\src-tauri\target\release\bundle'
          if (Test-Path $bundle) {
            Remove-Item $bundle -Recurse -Force
          }
          pnpm build:desktop

      - name: Collect installers
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'apps\desktop\src-tauri\target\release\bundle'
          $msi = @(Get-ChildItem "$bundle\msi\*_x64_*.msi" -File)
          $nsis = @(Get-ChildItem "$bundle\nsis\*_x64-setup.exe" -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw 'Expected exactly one Windows x64 MSI and one NSIS installer.'
          }
          New-Item -ItemType Directory -Path desktop-installers | Out-Null
          Copy-Item $msi[0].FullName desktop-installers\Viritura-windows-x64.msi
          Copy-Item $nsis[0].FullName desktop-installers\Viritura-windows-x64.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-x64
          path: desktop-installers
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish rolling desktop prerelease
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Only download this run's installers; never execute the build in a write job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-windows-x64
          path: desktop-installers

      - name: Replace rolling prerelease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const repo = context.repo;
            const tag = 'desktop-preview';
            const title = 'Viritura Desktop Preview (Windows x64)';
            const { data: main } = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) {
              core.notice('Skipping superseded build: main has advanced. Run this workflow on main to recover.');
              return;
            }

            const directory = path.join(process.env.GITHUB_WORKSPACE, 'desktop-installers');
            const names = ['Viritura-windows-x64.exe', 'Viritura-windows-x64.msi'];
            const files = await fs.readdir(directory);
            if (files.length !== names.length || names.some(name => !files.includes(name))) {
              throw new Error('Expected only the two Windows x64 installers from this build.');
            }
            const sizes = new Map();
            for (const name of names) {
              const stat = await fs.stat(path.join(directory, name));
              if (!stat.isFile() || stat.size === 0 || stat.size >= 2 ** 31) {
                throw new Error(`Invalid release asset: ${name}`);
              }
              sizes.set(name, stat.size);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && (existing.name !== title || !existing.prerelease || existing.immutable)) {
              throw new Error('Refusing to replace an unrelated or immutable release at desktop-preview.');
            }
            let tagExists = false;
            try {
              await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagExists && !existing) {
              throw new Error('Refusing to move desktop-preview: the tag exists without its managed release.');
            }

            const body = [
              'Rolling **unsigned Windows x64 preview** built from `main`. Not a stable release.',
              '',
              `Commit: [${context.sha}](${context.serverUrl}/${repo.owner}/${repo.repo}/commit/${context.sha})`,
              `Build: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`,
              '',
              'Download either the NSIS `.exe` installer or the `.msi` installer (not both).',
              'These installers are not code-signed; Windows SmartScreen may warn or your organization may block installation.',
              'Preview builds retain the app version in source; uninstall an older preview first if Windows refuses replacement.',
              'Install updates manually; this workflow does not enable automatic updates.',
              '',
              'This prerelease and its assets are replaced after successful main builds. Only Windows x64 is published.',
            ].join('\n');
            // Hide the release before replacing assets so partial/mixed uploads are never public.
            // A failed publish remains a draft and can be recovered by a main workflow dispatch.
            const { data: release } = existing
              ? await github.rest.repos.updateRelease({ ...repo, release_id: existing.id, tag_name: tag, draft: true })
              : await github.rest.repos.createRelease({
                  ...repo, tag_name: tag, target_commitish: context.sha,
                  name: title, body, draft: true, prerelease: true, make_latest: 'false',
                });
            const release_id = release.id;
            const oldAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id, per_page: 100,
            });
            for (const asset of oldAssets) {
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
            }
            for (const name of names) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id, name,
                data: await fs.readFile(path.join(directory, name)),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }
            const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id, per_page: 100,
            });
            if (uploaded.length !== names.length || names.some(name =>
              !uploaded.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size === sizes.get(name))
            )) {
              throw new Error('Release asset verification failed; leaving the release as a draft.');
            }

            // Move the tag only after both installers are uploaded and verified.
            if (tagExists) {
              await github.rest.git.updateRef({ ...repo, ref: `tags/${tag}`, sha: context.sha, force: true });
            } else {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }
            await github.rest.repos.updateRelease({
              ...repo, release_id, tag_name: tag, target_commitish: context.sha,
              name: title, body, draft: false, prerelease: true, make_latest: 'false',
            });
            core.notice(`Published ${context.serverUrl}/${repo.owner}/${repo.repo}/releases/tag/${tag}`);
