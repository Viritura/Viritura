name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.93.1
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm --filter @viritura/website test
      - name: Build website
        run: pnpm --filter @viritura/website build
        env:
          VITE_VIRITURA_API_BASE_URL: https://api.viritura.com
      - name: Build public MNX examples
        run: pnpm turbo run build-storybook:mnx --filter=@viritura/editor
        env:
          VIRITURA_SITE: "true"
      - name: Assemble public MNX examples
        shell: bash
        run: |
          mkdir -p apps/website/dist/mnx/examples
          cp -a apps/editor/storybook-mnx-static/. apps/website/dist/mnx/examples/
          cp apps/website/dist/mnx/examples/iframe.html apps/website/dist/mnx/iframe.html
          cp apps/website/dist/mnx/examples/index.json apps/website/dist/mnx/index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-${{ github.sha }}
          path: apps/website/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://viritura.com
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-${{ github.sha }}
          path: dist
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy website
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          tar -czf website.tar.gz -C dist .
          ssh "$SSH_USER@$SSH_HOST" 'mkdir -p upload-static'
          scp website.tar.gz "$SSH_USER@$SSH_HOST:upload-static/website.tar.gz.next"
          ssh "$SSH_USER@$SSH_HOST" 'mv upload-static/website.tar.gz.next upload-static/website.tar.gz && sudo /usr/local/sbin/viritura-static-manage website'
      - name: Verify website
        run: curl --fail --retry 5 --retry-delay 2 https://viritura.com/
