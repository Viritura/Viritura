name: Score engine distribution

# Standalone build of @viritura/score-engine + @viritura/score-viewer for
# embedders that don't consume the Viritura monorepo (issue #241).
#  - Every push to main uploads a `score-engine-<sha>` workflow artifact.
#  - Tags `score-engine-v*` publish a GitHub Release with the zip attached.

on:
  push:
    branches: [main]
    tags: ["score-engine-v*"]
    paths:
      - engine/**
      - packages/**
      - assets/fonts/**
      - scripts/build-score-engine-dist.ts
      - scripts/build-wasm.ts
      - pnpm-lock.yaml
      - .github/workflows/score-engine-dist.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: score-engine-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.93.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build WASM
        run: pnpm wasm:build

      - name: Test engine and viewer
        run: pnpm turbo run test --filter=@viritura/score-engine --filter=@viritura/score-viewer

      - name: Build distribution
        run: pnpm build:score-engine-dist

      - id: meta
        name: Name the archive
        shell: bash
        run: |
          version=$(node -p "require('./packages/score-engine/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/score-engine-v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/score-engine-v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag version $tag_version does not match package version $version"
              exit 1
            fi
            name="score-engine-$version"
          else
            name="score-engine-$version-${GITHUB_SHA::12}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          (cd dist && mv score-engine "$name" && zip -qr "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/${{ steps.meta.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      - if: startsWith(github.ref, 'refs/tags/score-engine-v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: |
            dist/${{ steps.meta.outputs.name }}.zip
            dist/${{ steps.meta.outputs.name }}.zip.sha256
          if-no-files-found: error

    outputs:
      name: ${{ steps.meta.outputs.name }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/score-engine-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$NAME" \
            --notes "Standalone @viritura/score-engine + @viritura/score-viewer build from ${GITHUB_SHA}. See README.md and manifest.json inside the archive."
