name: Score engine distribution

# Standalone builds of @viritura/score-engine, @viritura/score-viewer and
# @viritura/score-viewer-react for embedders that don't consume the Viritura
# monorepo (issue #241).
#  - Pull requests that touch the packages' inputs build the release archive
#    and the npm packages, then install the packed tarballs into a fresh
#    project and render with them (scripts/verify-npm-packages.ts).
#  - Pushes to main also upload a `score-engine-<version>-<sha>` workflow
#    artifact (a preview build).
#  - Releases (npm and the GitHub Release with the zip attached) are made by
#    the manual npm-publish.yml workflow, which stamps real versions; builds
#    here carry the workspace's 0.0.0-dev placeholder.
# Paths are the packages' dependency closure only: score-viewer-react →
# score-viewer → score-engine → renderer/format/midi → core, plus the Rust
# engine and bundled fonts.

on:
  push:
    branches: [main]
    paths: &package-inputs
      - engine/**
      - packages/core/**
      - packages/format/**
      - packages/midi/**
      - packages/renderer/**
      - packages/score-engine/**
      - packages/score-viewer/**
      - packages/score-viewer-react/**
      - assets/fonts/**
      - scripts/build-score-engine-dist.ts
      - scripts/build-npm-packages.ts
      - scripts/verify-npm-packages.ts
      - scripts/score-release.ts
      - scripts/score-packages/**
      - scripts/build-wasm.ts
      - .github/workflows/score-engine-dist.yml
  pull_request:
    paths: *package-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: score-engine-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.93.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build WASM
        run: pnpm wasm:build

      - name: Check package versions
        run: pnpm score-release check

      - name: Test engine and viewers
        run: pnpm turbo run test --filter=@viritura/score-engine --filter=@viritura/score-viewer --filter=@viritura/score-viewer-react

      - name: Build distribution
        run: pnpm build:score-engine-dist

      - name: Build npm packages
        run: pnpm build:npm-packages

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify packed npm packages
        run: pnpm verify:npm-packages --render

      - id: meta
        if: github.event_name != 'pull_request'
        name: Name the archive
        shell: bash
        run: |
          name="score-engine-${GITHUB_SHA::12}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          (cd dist && mv score-engine "$name" && zip -qr "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/${{ steps.meta.outputs.name }}
          if-no-files-found: error
          retention-days: 90
