[package]
name = "viritura-desktop"
version = "0.0.1"
description = "Viritura desktop shell wrapping the web editor"
edition = "2021"
rust-version = "1.77"
publish = false

# Standalone crate — intentionally NOT part of engine/Cargo.toml workspace so the
# WASM engine build and this desktop shell stay decoupled.
[workspace]

[lib]
name = "viritura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mlua = { version = "=0.11.6", default-features = false, features = ["lua54", "vendored"] }
vst3-host = { version = "=0.7.0", default-features = false, features = ["cpal-backend"] }
rayon = "1"
rustysynth = "1.3.6"

[target.'cfg(windows)'.dependencies]
winapi = { version = "=0.3.9", features = ["libloaderapi", "processthreadsapi", "winuser"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
