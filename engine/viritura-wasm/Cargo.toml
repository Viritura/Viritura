[package]
name = "viritura-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the Viritura engraving engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
viritura-engine = { path = "../viritura-engine" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"

# Pulled in transitively via ahash -> jsonschema -> viritura-engine. On
# wasm32-unknown-unknown getrandom 0.3 needs the `wasm_js` backend explicitly
# enabled (both the feature here and the rustflag in .cargo/config.toml).
# See https://docs.rs/getrandom/0.3/#webassembly-support
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
