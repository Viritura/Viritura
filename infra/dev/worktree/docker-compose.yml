# Per-worktree development stack. Driven by infra/dev/worktree.ps1.
#
# Public URLs are browser-reachable Traefik hosts. Internal URLs use Compose DNS
# and are valid only between containers on this worktree's default network.
name: viritura-${VIRITURA_SLUG:?set VIRITURA_SLUG (use infra/dev/worktree.ps1)}

x-node-build: &node-build
  image: viritura-dev-worktree:${VIRITURA_NODE_IMAGE_TAG:?set by infra/dev/worktree.ps1}

x-api-build: &api-build
  image: viritura-api-dev:${VIRITURA_API_IMAGE_TAG:?set by infra/dev/worktree.ps1}
  build:
    context: ../../..
    dockerfile: infra/dev/worktree/api.Dockerfile
    labels:
      com.viritura.dev.cache: api-image

x-wasm-image: &wasm-image
  image: viritura-wasm-dev:rust-1.93.1-wasm-pack-0.14.0

x-public-environment: &public-environment
  VIRITURA_PUBLIC_EDITOR_URL: http://editor.${VIRITURA_SLUG}.localhost
  VIRITURA_PUBLIC_WEBSITE_URL: http://web.${VIRITURA_SLUG}.localhost
  VIRITURA_PUBLIC_API_URL: http://api.${VIRITURA_SLUG}.localhost
  VIRITURA_INTERNAL_API_URL: http://api:8080
  VIRITURA_CACHE_ROOT: /tmp/viritura-cache
  VIRITURA_VITE_CACHE_DIR: /tmp/viritura-vite

x-managed-labels: &managed-labels
  com.viritura.dev.managed: "true"

x-node-volumes: &node-volumes
  - ../../..:/workspace
  # These read-only volumes are shared by every worktree with the same
  # dependency hash. Writable tool caches live under /tmp in each container.
  - node_modules:/workspace/node_modules:ro
  - package_audio_node_modules:/workspace/packages/audio/node_modules:ro
  - package_core_node_modules:/workspace/packages/core/node_modules:ro
  - package_crdt_node_modules:/workspace/packages/crdt/node_modules:ro
  - app_editor_node_modules:/workspace/apps/editor/node_modules:ro
  - package_format_node_modules:/workspace/packages/format/node_modules:ro
  - package_instrument_profiles_node_modules:/workspace/packages/instrument-profiles/node_modules:ro
  - package_midi_node_modules:/workspace/packages/midi/node_modules:ro
  - package_monaco_react_node_modules:/workspace/packages/monaco-react/node_modules:ro
  - package_musicxml_node_modules:/workspace/packages/musicxml/node_modules:ro
  - package_piano_roll_node_modules:/workspace/packages/piano-roll/node_modules:ro
  - package_playback_node_modules:/workspace/packages/playback/node_modules:ro
  - package_renderer_node_modules:/workspace/packages/renderer/node_modules:ro
  - package_score_engine_node_modules:/workspace/packages/score-engine/node_modules:ro
  - package_score_viewer_react_node_modules:/workspace/packages/score-viewer-react/node_modules:ro
  - package_sound_profiles_node_modules:/workspace/packages/sound-profiles/node_modules:ro
  - package_ui_node_modules:/workspace/packages/ui/node_modules:ro
  - package_video_sync_node_modules:/workspace/packages/video-sync/node_modules:ro
  - example_score_viewer_node_modules:/workspace/examples/score-viewer-react-minimal/node_modules:ro
  - app_desktop_node_modules:/workspace/apps/desktop/node_modules:ro
  - app_server_ui_node_modules:/workspace/apps/server-ui/node_modules:ro
  - app_vscode_viewer_node_modules:/workspace/apps/vscode-mnx-viewer/node_modules:ro
  - app_website_node_modules:/workspace/apps/website/node_modules:ro

x-node-cache-tmpfs: &node-cache-tmpfs
  - /workspace/apps/editor/node_modules/.cache
  - /workspace/apps/editor/node_modules/.vite-temp
  - /workspace/apps/server-ui/node_modules/.vite-temp
  - /workspace/apps/website/node_modules/.vite
  - /workspace/apps/website/node_modules/.vite-temp
  - /workspace/packages/ui/node_modules/.cache

x-node-service: &node-service
  <<: *node-build
  entrypoint: ["sh", "/workspace/infra/dev/worktree/entrypoint.sh"]
  env_file:
    - path: ../.env.frontend.local
      required: false
  labels: *managed-labels
  tmpfs: *node-cache-tmpfs
  volumes: *node-volumes

x-proxy-networks: &proxy-networks
  - default
  - proxy

services:
  # Build-only target used by worktree.ps1. Keeping the build definition on one
  # service prevents concurrent frontend services from racing on the same tag.
  node-image:
    profiles: ["images"]
    image: viritura-dev-worktree:${VIRITURA_NODE_IMAGE_TAG}
    build:
      context: ../../..
      dockerfile: infra/dev/worktree/dev.Dockerfile
      labels:
        com.viritura.dev.cache: node-image
    command: ["true"]

  # Mounting an empty named volume over an image directory makes Docker seed it
  # from that directory. The wrapper serializes this one-shot step so concurrent
  # worktrees cannot race while initializing a shared dependency hash.
  dependency-seed:
    <<: *node-build
    profiles: ["images"]
    command: ["true"]
    environment:
      VIRITURA_CACHE_ROOT: /tmp/viritura-cache
    tmpfs: *node-cache-tmpfs
    volumes: *node-volumes

  # One-shot cache-aware builder invoked automatically by worktree.ps1 for
  # profiles that render scores. It publishes ignored output through the source
  # bind mount, while all Linux-native Cargo state stays in Docker volumes.
  wasm-build:
    <<: *wasm-image
    profiles: ["build"]
    build:
      context: ../../..
      dockerfile: infra/dev/worktree/wasm.Dockerfile
    command: ["node", "--experimental-strip-types", "scripts/build-wasm.ts"]
    working_dir: /workspace
    volumes:
      - ../../..:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - wasm_pack_cache:/root/.cache/.wasm-pack
      - wasm_target:/workspace/engine/target

  wasm-watch:
    <<: *wasm-image
    profiles: ["watch"]
    command: ["node", "--experimental-strip-types", "scripts/watch-wasm.ts"]
    environment:
      # Keep watch artifacts smaller and faster for browser startup while
      # retaining Cargo's incremental development profile.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
    labels: *managed-labels
    working_dir: /workspace
    volumes:
      - ../../..:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - wasm_pack_cache:/root/.cache/.wasm-pack
      - wasm_target:/workspace/engine/target

  editor:
    <<: *node-service
    profiles: ["app", "editor", "ui", "full"]
    command: ["pnpm", "--filter", "@viritura/editor", "dev", "--configLoader", "runner"]
    environment:
      <<: *public-environment
      VIRITURA_CONTAINER_HOST: editor.${VIRITURA_SLUG}.localhost
      VITE_VIRITURA_API_BASE_URL: http://api.${VIRITURA_SLUG}.localhost
      VITE_VIRITURA_WEBSITE_URL: http://web.${VIRITURA_SLUG}.localhost
    networks: *proxy-networks
    labels:
      - com.viritura.dev.managed=true
      - traefik.enable=true
      - traefik.docker.network=viritura-dev-proxy
      - traefik.http.routers.${VIRITURA_SLUG}-editor.rule=Host(`editor.${VIRITURA_SLUG}.localhost`)
      - traefik.http.routers.${VIRITURA_SLUG}-editor.entryPoints=web
      - traefik.http.services.${VIRITURA_SLUG}-editor.loadbalancer.server.port=5173

  website:
    <<: *node-service
    profiles: ["website", "ui", "full"]
    # Container PIDs are recycled across recreates, so an Astro lock file on the
    # source bind mount can mistake an unrelated new process for the old server.
    command: ["pnpm", "--filter", "@viritura/website", "dev", "--configLoader", "runner", "--ignore-lock"]
    environment:
      <<: *public-environment
      VIRITURA_CONTAINER_HOST: web.${VIRITURA_SLUG}.localhost
      VITE_VIRITURA_API_BASE_URL: http://api.${VIRITURA_SLUG}.localhost
    networks: *proxy-networks
    labels:
      - com.viritura.dev.managed=true
      - traefik.enable=true
      - traefik.docker.network=viritura-dev-proxy
      - traefik.http.routers.${VIRITURA_SLUG}-web.rule=Host(`web.${VIRITURA_SLUG}.localhost`)
      - traefik.http.routers.${VIRITURA_SLUG}-web.entryPoints=web
      - traefik.http.services.${VIRITURA_SLUG}-web.loadbalancer.server.port=5180

  server-ui:
    <<: *node-service
    profiles: ["app", "backend", "website", "full"]
    command:
      - sh
      - -c
      - pnpm --filter @viritura/server-ui exec tsc --noEmit &&
        pnpm --filter @viritura/server-ui exec vite build --watch --configLoader runner
    environment:
      <<: *public-environment

  api:
    <<: *api-build
    profiles: ["app", "backend", "website", "full"]
    depends_on:
      - server-ui
    env_file:
      # worktree.ps1 resolves this outside the repository so frontend
      # containers and Docker build contexts cannot read backend secrets.
      - path: ${VIRITURA_API_ENV_FILE:?set by infra/dev/worktree.ps1}
        required: false
    environment:
      <<: *public-environment
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      Development__SeedTestAccount: "true"
      ConnectionStrings__VirituraDb: Data Source=/var/lib/viritura/data/viritura.dev.db
      Auth__RequireEmailVerification: "false"
      Auth__WebsiteBaseUrl: http://web.${VIRITURA_SLUG}.localhost
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      DataProtection__KeysDirectory: /var/lib/viritura/data-protection-keys
      Viritura__GitHub__RedirectUri: http://api.${VIRITURA_SLUG}.localhost/github/auth/callback
      Viritura__GitHub__FrontendBaseUrl: http://editor.${VIRITURA_SLUG}.localhost
      Viritura__GitHub__AllowedFrontendOrigins__0: http://editor.${VIRITURA_SLUG}.localhost
      Viritura__GitHub__AllowedFrontendOrigins__1: http://web.${VIRITURA_SLUG}.localhost
    volumes:
      - ../../..:/workspace
      - nuget_packages:/root/.nuget/packages
      - api_data:/var/lib/viritura
      - api_bin:/workspace/server/Viritura.Api/bin
      - api_obj:/workspace/server/Viritura.Api/obj
      - github_bin:/workspace/server/Viritura.GitHub/bin
      - github_obj:/workspace/server/Viritura.GitHub/obj
      - infrastructure_bin:/workspace/server/Viritura.Infrastructure/bin
      - infrastructure_obj:/workspace/server/Viritura.Infrastructure/obj
    networks: *proxy-networks
    labels:
      - com.viritura.dev.managed=true
      - traefik.enable=true
      - traefik.docker.network=viritura-dev-proxy
      - traefik.http.routers.${VIRITURA_SLUG}-api.rule=Host(`api.${VIRITURA_SLUG}.localhost`)
      - traefik.http.routers.${VIRITURA_SLUG}-api.entryPoints=web
      - traefik.http.services.${VIRITURA_SLUG}-api.loadbalancer.server.port=8080

  storybook-ui:
    <<: *node-service
    profiles: ["storybook", "storybook-ui", "full"]
    command:
      ["pnpm", "--filter", "@viritura/ui", "exec", "storybook", "dev", "-p", "6005", "--host", "0.0.0.0", "--no-open"]
    environment:
      <<: *public-environment
      CI: "true"
    networks: *proxy-networks
    labels:
      - com.viritura.dev.managed=true
      - traefik.enable=true
      - traefik.docker.network=viritura-dev-proxy
      - traefik.http.routers.${VIRITURA_SLUG}-storybook-ui.rule=Host(`ui.${VIRITURA_SLUG}.localhost`)
      - traefik.http.routers.${VIRITURA_SLUG}-storybook-ui.entryPoints=web
      - traefik.http.services.${VIRITURA_SLUG}-storybook-ui.loadbalancer.server.port=6005

  storybook-mnx:
    <<: *node-service
    profiles: ["storybook", "storybook-mnx", "full"]
    command: ["pnpm", "--filter", "@viritura/editor", "run", "storybook:mnx", "--host", "0.0.0.0", "--no-open"]
    environment:
      <<: *public-environment
      CI: "true"
      VITE_VIRITURA_API_BASE_URL: http://api.${VIRITURA_SLUG}.localhost
    networks: *proxy-networks
    labels:
      - com.viritura.dev.managed=true
      - traefik.enable=true
      - traefik.docker.network=viritura-dev-proxy
      - traefik.http.routers.${VIRITURA_SLUG}-storybook-mnx.rule=Host(`mnx.${VIRITURA_SLUG}.localhost`)
      - traefik.http.routers.${VIRITURA_SLUG}-storybook-mnx.entryPoints=web
      - traefik.http.services.${VIRITURA_SLUG}-storybook-mnx.loadbalancer.server.port=6006

  storybook-app:
    <<: *node-service
    profiles: ["storybook", "storybook-app", "full"]
    command: ["pnpm", "--filter", "@viritura/editor", "run", "storybook", "--host", "0.0.0.0", "--no-open"]
    environment:
      <<: *public-environment
      CI: "true"
      VITE_VIRITURA_API_BASE_URL: http://api.${VIRITURA_SLUG}.localhost
    networks: *proxy-networks
    labels:
      - com.viritura.dev.managed=true
      - traefik.enable=true
      - traefik.docker.network=viritura-dev-proxy
      - traefik.http.routers.${VIRITURA_SLUG}-storybook-app.rule=Host(`storybook.${VIRITURA_SLUG}.localhost`)
      - traefik.http.routers.${VIRITURA_SLUG}-storybook-app.entryPoints=web
      - traefik.http.services.${VIRITURA_SLUG}-storybook-app.loadbalancer.server.port=6007

