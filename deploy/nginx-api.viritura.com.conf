# Reverse proxy for the containerized Viritura API.
# TLS is added by: certbot --nginx -d api.viritura.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name api.viritura.com;
    return 301 https://api.viritura.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.viritura.com;
    ssl_certificate /etc/letsencrypt/live/api.viritura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.viritura.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    client_max_body_size 16m;
    include snippets/viritura-security-headers.conf;
    include snippets/viritura-api-content-security-policy.conf;

    location ~ /\.(?!well-known/) { deny all; }

    location /live/signal {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Browser-host WebSocket for ephemeral MCP sessions. Keep this separate
    # from /live/signal: the routes have different protocols and credentials.
    location ~ ^/mcp/sessions/[^/]+/host$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}