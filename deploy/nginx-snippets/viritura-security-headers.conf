# Shared security header snippet for all Viritura nginx vhosts.
# Include with:   include snippets/viritura-security-headers.conf;
#
# Deploy to:      /etc/nginx/snippets/viritura-security-headers.conf
#
# IMPORTANT — nginx add_header inheritance:
# When a `location {}` block declares its own add_header (e.g. for Cache-Control),
# ALL parent-scope add_header directives are dropped for that location. So this
# snippet MUST be included both at the `server {}` scope AND inside every
# `location {}` that sets its own add_header. Each vhost file in this directory
# follows that pattern.
#
# All headers use `always` so they're emitted on error responses (4xx/5xx) too.

# --- Clickjacking + MIME sniffing -------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

# --- Referrer policy --------------------------------------------------------
# Authentication tokens are fragment-held and scrubbed on landing. This policy
# additionally prevents full path/query disclosure on cross-origin navigation.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- HSTS -------------------------------------------------------------------
# 1 year, include subdomains. Add `preload` and submit to hstspreload.org once
# you're confident every host under viritura.com terminates TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Cross-origin isolation -------------------------------------------------
# Same-origin opener/resource so other windows can't reach into our context
# (Spectre defence-in-depth + COOP enables some isolation features).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# --- Permissions Policy -----------------------------------------------------
# Disable powerful APIs we don't use anywhere in the editor or website.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;

# --- CSP (Report-Only first; promote to enforcing after a week of clean reports) ---
# Editor (app.viritura.com) needs WebAssembly + cross-origin to the API.
# Website (viritura.com) needs cross-origin to the API and Google OAuth start.
# This baseline covers both — vhost-specific tightening can override later.
#
# 'unsafe-eval' is required by Ajv's runtime schema compiler. 'wasm-unsafe-eval'
# keeps the WebAssembly requirement explicit for the engine WASM bundle.
# The sha256 sources allow only the inline Storybook manager/preview bootstraps
# emitted by the deployed and current local MNX builds; arbitrary inline scripts
# remain blocked. Storybook's Monaco editor loader is served by jsDelivr.
# 'unsafe-inline' on style-src covers React inline `style={{}}` attributes; this
# is the standard trade-off for React apps that don't ship a build-time
# CSP-nonce pipeline. style-src-attr 'unsafe-inline' is the narrower form but
# is not yet broadly supported, so we keep style-src 'unsafe-inline' for now.
# Add a `report-uri` once a reporting endpoint exists.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net 'sha256-PUEVwoxdXh3/g2utDBC7wZSdVs5kkmQZ+t3mEu2fJuA=' 'sha256-XcCnpnZwNYaufCJB12YWcQCDZJx//MGNfHv40B9iXuI=' 'sha256-VEMORT8XQHifo9qiwdr3RUfoZHHlabZf+EfjYIpGYos=' 'sha256-WPTZFWfjn9nQAIWqe+g7k/uMJaVVYvzwzYt2khH0xAk=' 'sha256-9uH6lxIMkZ9BbH/KGU7cX3qG7DCarU5zjDI96iEvyQA=' 'sha256-0ncI0MvAfzLxbwY/DkL3yhWQ9pWEnyY+6IjzrggublU='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://lh3.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; media-src 'self' blob: https://assets.viritura.com; connect-src 'self' https://api.viritura.com wss://api.viritura.com https://api.github.com https://assets.viritura.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://github.com; object-src 'none'; upgrade-insecure-requests" always;
