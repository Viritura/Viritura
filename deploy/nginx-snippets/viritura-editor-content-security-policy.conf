# The WYSIWYG editor uses Ajv at document/import boundaries and WebAssembly for
# engraving. Raw Monaco surfaces rely on Monaco's MNX Schema diagnostics.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://avatars.githubusercontent.com https://lh3.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https://assets.viritura.com; connect-src 'self' https://api.viritura.com wss://api.viritura.com https://api.github.com https://assets.viritura.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://github.com; object-src 'none'; upgrade-insecure-requests" always;