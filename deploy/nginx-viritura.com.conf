# nginx vhost for viritura.com (canonical) + www.viritura.com (redirect).
# Place at: /etc/nginx/sites-available/viritura.com
# Symlink:  /etc/nginx/sites-enabled/viritura.com
# TLS added by: sudo certbot --nginx -d viritura.com -d www.viritura.com --redirect
#
# Docroot lives at /var/www/peter/viritura (renamed from /viritura
# when the project was rebranded). The legacy /viritura path is kept
# as a symlink → viritura for any out-of-band consumer (backups, etc.).
# harmonia.peteryang.io is a 301 redirect to this host — see
# nginx-harmonia.peteryang.io.conf.

server {
    listen 80;
    listen [::]:80;
    server_name viritura.com www.viritura.com;

    if ($host = www.viritura.com) {
        return 301 https://viritura.com$request_uri;
    }
    return 301 https://viritura.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name viritura.com www.viritura.com;
    ssl_certificate /etc/letsencrypt/live/viritura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viritura.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    root /var/www/peter/viritura;
    index index.html;

    # Security headers (HSTS / X-Frame-Options / CSP-Report-Only / etc.).
    # See snippets/viritura-security-headers.conf for inheritance rules.
    include snippets/viritura-security-headers.conf;

    location = /_headers { return 404; }
    location ~ \.map$ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }

    # Redirect www → apex (canonical host).
    if ($host = www.viritura.com) {
        return 301 https://viritura.com$request_uri;
    }

    # The default mime map (already loaded by /etc/nginx/nginx.conf at the
    # http{} level) covers WASM on Ubuntu 24. We don't redeclare a
    # `types {}` block here because doing so would *replace* the inherited
    # map and silently break HTML/CSS/JS content-types.

    # Long-cache fingerprinted Vite assets (foo.[hash].js / .css / etc.).
    location ~* /(assets|wasm)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-include security headers because any add_header in a location
        # block silently drops the server-scope ones.
        include snippets/viritura-security-headers.conf;
        try_files $uri =404;
    }

    # HTML entry points must NEVER be cached without revalidation. Vite gives
    # bundled assets content hashes and the location above marks them
    # immutable, but index.html itself is the only thing that knows which
    # hashed bundle is current. Without this header, browsers cache index.html
    # via the freshness heuristic (often hours/days) and keep loading the
    # previously-deployed bundle until the user hard-refreshes.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include snippets/viritura-security-headers.conf;
        expires 0;
    }

    # Website SPA route for the MusicXML→MNX converter.
    location /mnx-converter/ {
        try_files $uri $uri/ /index.html;
    }

    # Preserve the known public entry points from the former /mnx Storybook.
    location = /mnx/iframe.html {
        return 301 /mnx/examples/iframe.html$is_args$args;
    }

    location = /mnx/index.json {
        return 301 /mnx/examples/index.json$is_args$args;
    }

    location = /mnx/ {
        if ($arg_path != "") {
            return 301 /mnx/examples/$is_args$args;
        }
        try_files /mnx/index.html =404;
    }

    # MNX Storybook remains a fully static export under /mnx/examples/.
    location /mnx/examples/ {
        try_files $uri $uri/ =404;
    }

    # Hub and playground are website SPA routes with static fallback copies.
    location /mnx/ {
        try_files $uri $uri/ /index.html;
    }

    # Landing page (no client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
