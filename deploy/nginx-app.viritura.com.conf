# nginx vhost for app.viritura.com — the Viritura editor (Vite SPA).
#
# Place at:   /etc/nginx/sites-available/app.viritura.com
# Symlink:    /etc/nginx/sites-enabled/app.viritura.com
# TLS added:  sudo certbot --nginx -d app.viritura.com --redirect
#
# The editor's Vite build uses base: "/" (see apps/editor/vite.config.ts)
# because it owns its own origin here — no /app/ path prefix.
#
# Docroot points at the editor sub-tree of the unified deploy:
#   /var/www/peter/viritura/app
# build-site.mjs still emits the editor into dist/app/ so that deploy.mjs
# can ship the whole site (website + editor + mnx storybook) as a
# single tarball. The apex viritura.com vhost just doesn't serve /app
# anymore — that subtree exists only to back this vhost.

server {
    listen 80;
    listen [::]:80;
    server_name app.viritura.com;
    return 301 https://app.viritura.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.viritura.com;
    ssl_certificate /etc/letsencrypt/live/app.viritura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.viritura.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    root /var/www/peter/viritura/app;
    index index.html;

    # Security headers (HSTS / X-Frame-Options / CSP-Report-Only / etc.).
    # See snippets/viritura-security-headers.conf for inheritance rules.
    include snippets/viritura-security-headers.conf;

    location = /_headers { return 404; }
    location ~ \.map$ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }

    # Long-cache fingerprinted Vite assets (foo.[hash].js / .css / .wasm).
    location ~* /(assets|wasm)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-include because any location-scope add_header drops server-scope ones.
        include snippets/viritura-security-headers.conf;
        try_files $uri =404;
    }

    # HTML entry must revalidate so deploys take effect immediately.
    # See the equivalent comment in nginx-viritura.com.conf for the
    # caching rationale.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include snippets/viritura-security-headers.conf;
        expires 0;
    }

    # SPA fallback — every unknown route serves index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
